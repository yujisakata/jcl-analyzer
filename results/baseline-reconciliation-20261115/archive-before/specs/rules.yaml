# specs/ibm-jcl-reference.md is GENERATED from this file plus the Golden Test suite
# (`jclprof rules-render`); a harness test fails when the two drift apart.
#
# status:
#   VERIFIED       primary IBM text opened and read; chapter/section/page recorded
#   CROSS-CHECKED  same content seen in several IBM editions; section/page not recorded
#   PENDING        primary source not confirmed; dependent checks are INFO only; tests cannot be approved
#   PROJECT-POLICY not an IBM rule: a project decision (requirements/ADR) about how the tool reports
#                  something IBM leaves unspecified. Never counted as "IBM-backed".
#
# Pages: "printed page (PDF page)" of the document named in `doc`.
