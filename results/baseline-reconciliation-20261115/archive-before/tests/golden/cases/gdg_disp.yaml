schema_version: 1
category: GDG_DISP
cases:
  - test_id: G-GD-001
    category: GDG_DISP
    description: "Requirements FR-02 example: one DD statement over four records with a nested SPACE list and a GDG relative generation."
    rule_ids: [JCL-CONT-001, JCL-FMT-005, JCL-SYN-002]
    source_reference:
      - {rule_id: "JCL-CONT-001", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "3. Format of statements > Continuing JCL statements > Continuing the parameter field", pages: "16-17 (PDF 62-63)"}
      - {rule_id: "JCL-FMT-005", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "3. Format of statements > Parameter field > Multiple subparameters", pages: "15 (PDF 61)"}
      - {rule_id: "JCL-SYN-002", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "4. Syntax of parameters > Table 12 Special characters that do not require enclosing apostrophes", pages: "22-23 (PDF 68-69)"}
    input_file: inputs/gdg_disp/gd001.jcl
    input_kind: job
    case_type: valid
    validation_stage: syntactic
    expected_structure:
      view: statements
      statements:
        - {kind: JOB, span: [1, 1], name: GD001}
        - {kind: EXEC, span: [2, 2], name: STEP1}
        - kind: DD
          span: [3, 6]
          name: TRANSACT
          positional: []
          keywords: [[DISP, [NEW, CATLG, DELETE]], [UNIT, SYSDA], [SPACE, [CYL, ["1", "1"], RLSE]], [DSN, "APP.SYSTRAN(+1)"]]
          comment: null
    expected_diagnostics: {mode: exact, items: []}
    oracle_method: &m_ibm "Hand-derived from the cited IBM SA23-1385-70 rules. Input JCL designed by hand (tools/golden_authoring/make_inputs.py only fixes columns). Expected structure written manually, never generated from parser output."
    oracle_author: &author "Claude (AI assistant, claude-opus-5-5); draft awaiting human review"
    review_status: draft
    notes: "Input taken verbatim from docs/requirements.md FR-02."

  - test_id: G-GD-002
    category: GDG_DISP
    description: "Semantic view of FR-02: relative generation +1 is separated from the GDG base name; all DISP subparameters explicit."
    rule_ids: [JCL-DD-009, JCL-DD-007]
    source_reference:
      - {rule_id: "JCL-DD-009", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "12. DD statement > DSNAME parameter > dsname(generation)", pages: "165-166 (PDF 211-212)"}
      - {rule_id: "JCL-DD-007", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "12. DD statement > DISP parameter > Syntax", pages: "147-148 (PDF 193-194)"}
    input_file: inputs/gdg_disp/gd001.jcl
    input_kind: job
    case_type: valid
    validation_stage: semantic
    expected_structure:
      view: dd_resources
      dd_resources:
        - {step: STEP1, ddname: TRANSACT, concat_index: 0, line: 3, dsn: APP.SYSTRAN, generation: 1, disp: {status: NEW, normal: CATLG, abnormal: DELETE, defaulted: []}}
    expected_diagnostics: {mode: exact, items: []}
    oracle_method: *m_ibm
    oracle_author: *author
    review_status: draft
    notes: "A mutation that flips the generation sign must make this case fail (requirements 6.6)."

  - test_id: G-GD-003
    category: GDG_DISP
    description: "DISP defaults: DISP omitted, SHR, (,CATLG), (NEW,PASS), (OLD,PASS), (OLD,,DELETE)."
    rule_ids: [JCL-DD-007, JCL-DD-008]
    source_reference:
      - {rule_id: "JCL-DD-007", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "12. DD statement > DISP parameter > Syntax", pages: "147-148 (PDF 193-194)"}
      - {rule_id: "JCL-DD-008", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "12. DD statement > DISP parameter > Defaults", pages: "152 (PDF 198)"}
    input_file: inputs/gdg_disp/gd003.jcl
    input_kind: job
    case_type: boundary
    validation_stage: semantic
    expected_structure:
      view: dd_resources
      dd_resources:
        - {step: STEP1, ddname: D1, concat_index: 0, line: 3, dsn: A.NODISP, generation: null, disp: {status: NEW, normal: DELETE, abnormal: DELETE, defaulted: [status, normal, abnormal]}}
        - {step: STEP1, ddname: D2, concat_index: 0, line: 4, dsn: A.SHR, generation: null, disp: {status: SHR, normal: KEEP, abnormal: KEEP, defaulted: [normal, abnormal]}}
        - {step: STEP1, ddname: D3, concat_index: 0, line: 5, dsn: A.NEWCAT, generation: null, disp: {status: NEW, normal: CATLG, abnormal: CATLG, defaulted: [status, abnormal]}}
        - {step: STEP1, ddname: D4, concat_index: 0, line: 6, dsn: A.NEWPASS, generation: null, disp: {status: NEW, normal: PASS, abnormal: DELETE, defaulted: [abnormal]}}
        - {step: STEP1, ddname: D5, concat_index: 0, line: 7, dsn: A.OLDPASS, generation: null, disp: {status: OLD, normal: PASS, abnormal: KEEP, defaulted: [abnormal]}}
        - {step: STEP1, ddname: D6, concat_index: 0, line: 8, dsn: A.OLDDEL, generation: null, disp: {status: OLD, normal: KEEP, abnormal: DELETE, defaulted: [normal]}}
    expected_diagnostics: {mode: exact, items: []}
    oracle_method: *m_ibm
    oracle_author: *author
    review_status: draft
    notes: "Every value comes from the DISP Defaults list on p.152. The web search summary claimed KEEP for an omitted normal disposition on NEW; the primary text says DELETE, and this case follows the primary text. Temporary data sets are not involved."

  - test_id: G-GD-004
    category: GDG_DISP
    description: "DISP=MOD: default dispositions depend on whether the data set exists at run time; both outcomes are represented as RUNTIME_DEPENDENT, without guessing."
    rule_ids: [JCL-DD-008, JCL-DD-012, POL-007]
    source_reference:
      - {rule_id: "JCL-DD-008", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "12. DD statement > DISP parameter > Defaults", pages: "152 (PDF 198)"}
      - {rule_id: "JCL-DD-012", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "12. DD statement > DISP parameter > Status subparameter > MOD", pages: "148 (PDF 194)"}
      - {rule_id: "POL-007", url: "docs/requirements.md", edition: "requirements.md v1.0 / docs/decisions.md", section: "decisions.md > ADR-022", pages: "-"}
    input_file: inputs/gdg_disp/gd004.jcl
    input_kind: job
    case_type: boundary
    validation_stage: semantic
    expected_structure:
      view: dd_resources
      dd_resources:
        - step: STEP1
          ddname: D7
          concat_index: 0
          line: 3
          dsn: A.MOD
          dsn_raw: A.MOD
          generation: null
          disp:
            status: MOD
            normal: {runtime_dependent: {if_new: DELETE, if_existing: KEEP, basis: "JCL-DD-008 default (DELETE for NEW, KEEP for existing) + JCL-DD-012 (MOD is new or existing at run time)"}}
            abnormal: {runtime_dependent: {if_new: DELETE, if_existing: KEEP, basis: "JCL-DD-008: implied by the second subparameter"}}
            defaulted: [normal, abnormal]
    expected_diagnostics: {mode: exact, items: []}
    oracle_method: "Hand-derived from the cited IBM SA23-1385-70 rules. Input JCL designed by hand (tools/golden_authoring/make_inputs.py only fixes columns). Expected structure written manually, never generated from parser output."
    oracle_author: "Claude (AI assistant, claude-opus-5-5); draft awaiting human review"
    review_status: draft
    change_log:
      - date: "2026-11-15"
        reason: "User decision A1: model run-time state with a dedicated type; do not assume existence."
        before: {review_status: blocked, expected_structure: {view: none}, rule_ids: [JCL-DD-008]}
        after: {review_status: draft, expected_structure: {view: dd_resources, disp: RUNTIME_DEPENDENT}, rule_ids: [JCL-DD-008, JCL-DD-012, POL-007]}
        basis: "ADR-022; SA23-1385-70 p.148 (MOD) and p.152 (Defaults)"
        approver: "user decision A1 (the case itself remains draft)"
    notes: "IBM p.148: without volume information the system assumes a new data set, so the outcome depends on the catalog at run time."

  - test_id: G-GD-005
    category: GDG_DISP
    description: "Relative generation boundaries: +255, -002, 0, 000, and no generation."
    rule_ids: [JCL-DD-009, JCL-DD-008]
    source_reference:
      - {rule_id: "JCL-DD-009", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "12. DD statement > DSNAME parameter > dsname(generation)", pages: "165-166 (PDF 211-212)"}
      - {rule_id: "JCL-DD-008", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "12. DD statement > DISP parameter > Defaults", pages: "152 (PDF 198)"}
    input_file: inputs/gdg_disp/gd005.jcl
    input_kind: job
    case_type: boundary
    validation_stage: semantic
    expected_structure:
      view: dd_resources
      dd_resources:
        - {step: STEP1, ddname: G1, concat_index: 0, line: 3, dsn: A.GDG, generation: 255, disp: {status: NEW, normal: CATLG, abnormal: CATLG, defaulted: [abnormal]}}
        - {step: STEP1, ddname: G2, concat_index: 0, line: 4, dsn: A.GDG, generation: -2, disp: {status: SHR, normal: KEEP, abnormal: KEEP, defaulted: [normal, abnormal]}}
        - {step: STEP1, ddname: G3, concat_index: 0, line: 5, dsn: A.GDG, generation: 0, disp: {status: SHR, normal: KEEP, abnormal: KEEP, defaulted: [normal, abnormal]}}
        - {step: STEP1, ddname: G4, concat_index: 0, line: 6, dsn: A.GDG, generation: 0, disp: {status: SHR, normal: KEEP, abnormal: KEEP, defaulted: [normal, abnormal]}}
        - {step: STEP1, ddname: G5, concat_index: 0, line: 7, dsn: A.GDG, generation: null, disp: {status: SHR, normal: KEEP, abnormal: KEEP, defaulted: [normal, abnormal]}}
    expected_diagnostics: {mode: exact, items: []}
    oracle_method: *m_ibm
    oracle_author: *author
    review_status: draft
    notes: "G5 has no generation. Whether A.GDG is a GDG base (all generations) or a plain data set cannot be decided without the catalog (requirement FR-05), and this view does not model that."

  - test_id: G-GD-006
    category: GDG_DISP
    description: "Invalid relative generations: +256 (over 255), +1000 (four digits), +A (not numeric)."
    rule_ids: [JCL-DD-009, JCL-DD-010, POL-001]
    source_reference:
      - {rule_id: "JCL-DD-009", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "12. DD statement > DSNAME parameter > dsname(generation)", pages: "165-166 (PDF 211-212)"}
      - {rule_id: "JCL-DD-010", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "12. DD statement > DSNAME parameter > dsname(member)", pages: "165 (PDF 211)"}
      - {rule_id: "POL-001", url: "docs/requirements.md", edition: "requirements.md v1.0 / docs/decisions.md", section: "requirements.md > 1.3, FR-03, 7.4", pages: "-"}
    input_file: inputs/gdg_disp/gd006.jcl
    input_kind: job
    case_type: invalid
    validation_stage: semantic
    expected_structure: {view: none, reason: "Invalid case: only the diagnostics are asserted."}
    expected_diagnostics:
      mode: exact
      items:
        - {code: SEM-E001, severity: ERROR, line: 3}
        - {code: SEM-E001, severity: ERROR, line: 4}
        - {code: SEM-E001, severity: ERROR, line: 5}
    oracle_method: &m_pol "Hand-derived. IBM states the coding rule but not the consequence of violating it, so the expected diagnostic follows project policy (POL rule cited)."
    oracle_author: *author
    review_status: draft
    notes: "JCL-DD-010: a member starting with + or - is a GDG generation, so +A is an invalid generation rather than a member."

  - test_id: G-GD-007
    category: GDG_DISP
    description: "CardDemo sample: an IEBGENER step whose continued SYSUT2 DD writes a GDG +1 generation, with symbols left as raw text."
    rule_ids: [JCL-CONT-001, JCL-FMT-005, JCL-SYN-002, JCL-FMT-009]
    source_reference:
      - {rule_id: "JCL-CONT-001", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "3. Format of statements > Continuing JCL statements > Continuing the parameter field", pages: "16-17 (PDF 62-63)"}
      - {rule_id: "JCL-FMT-005", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "3. Format of statements > Parameter field > Multiple subparameters", pages: "15 (PDF 61)"}
      - {rule_id: "JCL-SYN-002", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "4. Syntax of parameters > Table 12 Special characters that do not require enclosing apostrophes", pages: "22-23 (PDF 68-69)"}
      - {rule_id: "JCL-FMT-009", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "3. Format of statements > Table 8 JCL statement fields", pages: "14 (PDF 60)"}
    input_file: corpus://carddemo/app-transaction-type-db2/jcl/TRANEXTR.jcl
    corpus_source: {root_id: carddemo, rel_path: app-transaction-type-db2/jcl/TRANEXTR.jcl, sha256: d4d3b99a71b91fbce9c145283642ee7ca31b5ad7fa51ddcdb3e2c0b2e530457f, lines: [31, 38]}
    scope: {lines: [31, 38]}
    input_kind: job
    case_type: valid
    validation_stage: syntactic
    expected_structure:
      view: statements
      statements:
        - {kind: EXEC, span: [31, 31], name: STEP10, positional: [], keywords: [[PGM, IEBGENER]]}
        - {kind: DD, span: [32, 32], name: SYSPRINT, positional: [], keywords: [[SYSOUT, "*"]]}
        - {kind: DD, span: [33, 33], name: SYSIN, positional: [DUMMY], keywords: []}
        - {kind: DD, span: [34, 34], name: SYSUT1, positional: [], keywords: [[DISP, SHR], [DSN, "&HLQ..TRANTYPE.PS"]]}
        - kind: DD
          span: [35, 38]
          name: SYSUT2
          positional: []
          keywords: [[DSN, "&HLQ..TRANTYPE.BKUP(+1)"], [DISP, [NEW, CATLG]], [DCB, [{kw: [LRECL, "60"]}, {kw: [RECFM, FB]}, {kw: [BLKSIZE, "600"]}]], [SPACE, [TRK, ["1", "1"], RLSE]]]
    expected_diagnostics: {mode: exact, items: []}
    oracle_method: &m_corpus "Manual structural analysis of the cited CardDemo line range (read-only). File identity fixed by the SHA-256 from the independent shell oracle (tests/acceptance/expected). Not derived from any parser."
    oracle_author: *author
    review_status: draft
    notes: "A supplementary real-asset case. Symbol resolution is covered separately by G-JIS-012."
