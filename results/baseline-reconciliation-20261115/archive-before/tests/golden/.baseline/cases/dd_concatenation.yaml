    description: "CardDemo sample: an EXEC with a continued quoted PARM, and STEPLIB and IMS DD concatenations around comment statements."
    rule_ids: [JCL-DD-001, JCL-CONT-001, JCL-SYN-001, JCL-STMT-COMMENT]
    source_reference:
      - {rule_id: "JCL-DD-001", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "12. DD statement > Name field > Omitting the ddname; Concatenating data sets", pages: "75 (PDF 121); 92 (PDF 138)"}
      - {rule_id: "JCL-CONT-001", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "3. Format of statements > Continuing JCL statements > Continuing the parameter field", pages: "16-17 (PDF 62-63)"}
      - {rule_id: "JCL-SYN-001", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "4. Syntax of parameters > Special characters in parameters", pages: "22 (PDF 68)"}
