[project]
name = "jclprof"
version = "0.1.0"
description = "Static JCL profiler for deriving the minimal Batch IR feature set"
requires-python = "==3.12.*"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
jclprof = "jclprof.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "hypothesis>=6",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-PyYAML",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Default run = Harness suite (inventory unit/acceptance + harness self-tests). The parser
# verification suite (tests/parser, tests/property) is run separately (ADR-018).
testpaths = ["tests/unit", "tests/acceptance", "tests/harness"]
addopts = "-ra --strict-markers"
markers = [
    "corpus: acceptance tests against the real CardDemo corpus (skipped if absent)",
    "parser: verification of the future Parser/Resolver; skipped as NOT_IMPLEMENTED until adapters exist",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# authoring/review data scripts: long literal strings (case descriptions) are intentional
"tools/golden_authoring/*.py" = ["E501"]
"tools/golden_review/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]
mypy_path = "src,tests,tests/harness"
