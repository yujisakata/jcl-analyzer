schema_version: 1
category: IF_THEN_ELSE
cases:
  - test_id: G-IF-001
    category: IF_THEN_ELSE
    description: "IF (RC > 4) THEN / ELSE / ENDIF with one step in each clause; the condition is kept as an AST and not evaluated."
    rule_ids: [JCL-IF-001, JCL-IF-002, JCL-IF-003]
    source_reference:
      - {rule_id: "JCL-IF-001", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Purpose; Syntax; THEN and ELSE clauses", pages: "367, 373 (PDF 413, 419)"}
      - {rule_id: "JCL-IF-002", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Priorities of operators (Figure 1); Comparison/Logical operators", pages: "368-369 (PDF 414-415)"}
      - {rule_id: "JCL-IF-003", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Relational-expression keywords", pages: "370 (PDF 416)"}
    input_file: inputs/if/if001.jcl
    input_kind: job
    case_type: valid
    validation_stage: syntactic
    expected_structure:
      view: statements
      statements:
        - {kind: JOB, span: [1, 1], name: IF001}
        - {kind: EXEC, span: [2, 2], name: STEP1}
        - {kind: IF, span: [3, 3], name: CHK, condition: {op: GT, left: {kw: RC, step: null, procstep: null}, right: {num: 4}}}
        - {kind: EXEC, span: [4, 4], name: STEP2}
        - {kind: ELSE, span: [5, 5], name: null}
        - {kind: EXEC, span: [6, 6], name: STEP3}
        - {kind: ENDIF, span: [7, 7], name: null}
      blocks:
        - {kind: IF, name: CHK, start: 3, else: 5, end: 7}
    expected_diagnostics: {mode: exact, items: []}
    oracle_method: &m_ibm "Hand-derived from the cited IBM SA23-1385-70 rules. Input JCL designed by hand (tools/golden_authoring/make_inputs.py only fixes columns). Expected structure written manually, never generated from parser output."
    oracle_author: &author "Claude (AI assistant, claude-opus-5-5); draft awaiting human review"
    review_status: draft
    notes: "Requirement FR-07: the expression is kept; no execution path is chosen."

  - test_id: G-IF-002
    category: IF_THEN_ELSE
    description: "IBM IF Example 1: (ABEND | STEP1.RC > 8) combines a bare ABEND keyword with a step-qualified RC."
    rule_ids: [JCL-IF-002, JCL-IF-003]
    source_reference:
      - {rule_id: "JCL-IF-002", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Priorities of operators (Figure 1); Comparison/Logical operators", pages: "368-369 (PDF 414-415)"}
      - {rule_id: "JCL-IF-003", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Relational-expression keywords", pages: "370 (PDF 416)"}
    input_file: inputs/if/if002.jcl
    input_kind: job
    case_type: valid
    validation_stage: syntactic
    expected_structure:
      view: statements
      statements:
        - {kind: JOB, span: [1, 1], name: IF002}
        - {kind: EXEC, span: [2, 2], name: STEP1}
        - kind: IF
          span: [3, 3]
          name: IFBAD
          condition: {op: OR, args: [{kw: ABEND, step: null, procstep: null}, {op: GT, left: {kw: RC, step: STEP1, procstep: null}, right: {num: 8}}]}
        - {kind: EXEC, span: [4, 4], name: ERR}
        - {kind: ENDIF, span: [5, 5], name: null}
    expected_diagnostics: {mode: exact, items: []}
    oracle_method: &m_ex "Statement transcribed from the IBM SA23-1385-70 example on the cited page. Expected structure derived by hand from the cited rules."
    oracle_author: *author
    review_status: draft
    notes: "Example 1 (p.374)."

  - test_id: G-IF-003
    category: IF_THEN_ELSE
    description: "NOT written as the special character ¬ (no blank needed) and as the word NOT; both give the same AST."
    rule_ids: [JCL-IF-002]
    source_reference:
      - {rule_id: "JCL-IF-002", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Priorities of operators (Figure 1); Comparison/Logical operators", pages: "368-369 (PDF 414-415)"}
    input_file: inputs/if/if003.jcl
    input_kind: job
    case_type: valid
    validation_stage: syntactic
    expected_structure:
      view: statements
      statements:
        - {kind: JOB, span: [1, 1], name: IF003}
        - {kind: EXEC, span: [2, 2], name: STEP1}
        - {kind: IF, span: [3, 3], name: TESTNOTA, condition: {op: NOT, arg: {op: GT, left: {kw: RC, step: null, procstep: null}, right: {num: 8}}}}
        - {kind: EXEC, span: [4, 4], name: S2}
        - {kind: ENDIF, span: [5, 5], name: null}
        - {kind: IF, span: [6, 6], name: TESTNOTB, condition: {op: NOT, arg: {op: GT, left: {kw: RC, step: null, procstep: null}, right: {num: 8}}}}
        - {kind: EXEC, span: [7, 7], name: S3}
        - {kind: ENDIF, span: [8, 8], name: null}
    expected_diagnostics: {mode: exact, items: []}
    oracle_method: *m_ibm
    oracle_author: *author
    review_status: draft
    notes: "The input is UTF-8 (U+00AC). In EBCDIC source, ¬ is a code-page-dependent byte, which is another reason the code page must be configured, not guessed (ADR-009)."

  - test_id: G-IF-004
    category: IF_THEN_ELSE
    description: "AND and OR have the same priority and are evaluated in the order coded: RC = 8 | RC = 10 & RC > 2 means ((RC=8 | RC=10) & RC>2)."
    rule_ids: [JCL-IF-002]
    source_reference:
      - {rule_id: "JCL-IF-002", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Priorities of operators (Figure 1); Comparison/Logical operators", pages: "368-369 (PDF 414-415)"}
    input_file: inputs/if/if004.jcl
    input_kind: job
    case_type: boundary
    validation_stage: syntactic
    expected_structure:
      view: statements
      statements:
        - {kind: JOB, span: [1, 1], name: IF004}
        - {kind: EXEC, span: [2, 2], name: STEP1}
        - kind: IF
          span: [3, 3]
          name: PREC
          condition:
            op: AND
            args:
              - {op: OR, args: [{op: EQ, left: {kw: RC, step: null, procstep: null}, right: {num: 8}}, {op: EQ, left: {kw: RC, step: null, procstep: null}, right: {num: 10}}]}
              - {op: GT, left: {kw: RC, step: null, procstep: null}, right: {num: 2}}
        - {kind: EXEC, span: [4, 4], name: S2}
        - {kind: ENDIF, span: [5, 5], name: null}
    expected_diagnostics: {mode: exact, items: []}
    oracle_method: *m_ibm
    oracle_author: *author
    review_status: draft
    notes: "Figure 1 (p.369) gives AND and OR both the third priority. An implementation that binds AND more tightly than OR (as in many programming languages) must fail this case."

  - test_id: G-IF-005
    category: IF_THEN_ELSE
    description: "IBM TESTCON example: a relational expression continued where a blank is valid (column 15), with a comment after THEN."
    rule_ids: [JCL-IF-004, JCL-IF-002, JCL-FMT-007]
    source_reference:
      - {rule_id: "JCL-IF-004", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Continuing a relational expression", pages: "368 (PDF 414)"}
      - {rule_id: "JCL-IF-002", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Priorities of operators (Figure 1); Comparison/Logical operators", pages: "368-369 (PDF 414-415)"}
      - {rule_id: "JCL-FMT-007", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "3. Format of statements > Comments field", pages: "13 (PDF 59)"}
    input_file: inputs/if/if005.jcl
    input_kind: job
    case_type: valid
    validation_stage: syntactic
    expected_structure:
      view: statements
      statements:
        - {kind: JOB, span: [1, 1], name: IF005}
        - {kind: EXEC, span: [2, 2], name: STEP1}
        - kind: IF
          span: [3, 4]
          name: TESTCON
          comment: ["COMMENTS OK HERE"]
          condition:
            op: OR
            args:
              - op: OR
                args:
                  - {op: OR, args: [{op: EQ, left: {kw: RC, step: null, procstep: null}, right: {num: 8}}, {op: EQ, left: {kw: RC, step: null, procstep: null}, right: {num: 10}}]}
                  - {op: EQ, left: {kw: RC, step: null, procstep: null}, right: {num: 12}}
              - {op: EQ, left: {kw: RC, step: null, procstep: null}, right: {num: 14}}
        - {kind: EXEC, span: [5, 5], name: S2}
        - {kind: ENDIF, span: [6, 6], name: null}
    expected_diagnostics: {mode: exact, items: []}
    oracle_method: *m_ex
    oracle_author: *author
    review_status: draft
    notes: "p.368. Left-associative per docs/golden-view.md."

  - test_id: G-IF-006
    category: IF_THEN_ELSE
    description: "Nested IF constructs; the inner THEN clause is null (ELSE follows IF immediately)."
    rule_ids: [JCL-IF-001]
    source_reference:
      - {rule_id: "JCL-IF-001", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Purpose; Syntax; THEN and ELSE clauses", pages: "367, 373 (PDF 413, 419)"}
    input_file: inputs/if/if006.jcl
    input_kind: job
    case_type: boundary
    validation_stage: syntactic
    expected_structure:
      view: statements
      statements:
        - {kind: JOB, span: [1, 1], name: IF006}
        - {kind: EXEC, span: [2, 2], name: STEP1}
        - {kind: IF, span: [3, 3], name: OUTER, condition: {op: EQ, left: {kw: RC, step: null, procstep: null}, right: {num: 0}}}
        - {kind: IF, span: [4, 4], name: INNER, condition: {op: GT, left: {kw: RC, step: STEP1, procstep: null}, right: {num: 4}}}
        - {kind: ELSE, span: [5, 5], name: null}
        - {kind: EXEC, span: [6, 6], name: S3}
        - {kind: ENDIF, span: [7, 7], name: null}
        - {kind: ENDIF, span: [8, 8], name: null}
      blocks:
        - {kind: IF, name: OUTER, start: 3, else: null, end: 8}
        - {kind: IF, name: INNER, start: 4, else: 5, end: 7}
    expected_diagnostics: {mode: exact, items: []}
    oracle_method: *m_ibm
    oracle_author: *author
    review_status: draft
    notes: "A null THEN clause is defined on p.373. Blocks are ordered by start line."

  - test_id: G-IF-007
    category: IF_THEN_ELSE
    description: "IF construct with no ENDIF before end of input."
    rule_ids: [JCL-IF-001]
    source_reference:
      - {rule_id: "JCL-IF-001", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Purpose; Syntax; THEN and ELSE clauses", pages: "367, 373 (PDF 413, 419)"}
    input_file: inputs/if/if007.jcl
    input_kind: job
    case_type: invalid
    validation_stage: syntactic
    expected_structure: {view: none, reason: "Invalid case: only the diagnostic is asserted."}
    expected_diagnostics:
      mode: exact
      items: [{code: PAR-E004, severity: ERROR, line: 3}]
    oracle_method: *m_ibm
    oracle_author: *author
    review_status: draft
    notes: "'An ENDIF statement ... must be coded for each construct' (p.367). Reported at the unmatched IF."

  - test_id: G-IF-008
    category: IF_THEN_ELSE
    description: "ELSE and ENDIF with no matching IF."
    rule_ids: [JCL-IF-001, POL-001]
    source_reference:
      - {rule_id: "JCL-IF-001", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Purpose; Syntax; THEN and ELSE clauses", pages: "367, 373 (PDF 413, 419)"}
      - {rule_id: "POL-001", url: "docs/requirements.md", edition: "requirements.md v1.0 / docs/decisions.md", section: "requirements.md > 1.3, FR-03, 7.4", pages: "-"}
    input_file: inputs/if/if008.jcl
    input_kind: job
    case_type: invalid
    validation_stage: syntactic
    expected_structure: {view: none, reason: "Invalid case: only the diagnostics are asserted."}
    expected_diagnostics:
      mode: exact
      items:
        - {code: PAR-E005, severity: ERROR, line: 3}
        - {code: PAR-E005, severity: ERROR, line: 5}
    oracle_method: &m_pol "Hand-derived. IBM states the coding rule but not the consequence of violating it, so the expected diagnostic follows project policy (POL rule cited)."
    oracle_author: *author
    review_status: draft
    notes: ""

  - test_id: G-IF-009
    category: IF_THEN_ELSE
    description: "16 nested IF constructs (the maximum is 15); reported at the 16th IF."
    rule_ids: [JCL-IF-001, POL-001]
    source_reference:
      - {rule_id: "JCL-IF-001", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Purpose; Syntax; THEN and ELSE clauses", pages: "367, 373 (PDF 413, 419)"}
      - {rule_id: "POL-001", url: "docs/requirements.md", edition: "requirements.md v1.0 / docs/decisions.md", section: "requirements.md > 1.3, FR-03, 7.4", pages: "-"}
    input_file: inputs/if/if009.jcl
    input_kind: job
    case_type: boundary
    validation_stage: syntactic
    expected_structure: {view: none, reason: "Invalid case: only the diagnostic is asserted."}
    expected_diagnostics:
      mode: exact
      items: [{code: PAR-E011, severity: ERROR, line: 17}]
    oracle_method: *m_pol
    oracle_author: *author
    review_status: draft
    notes: "Records 2-17 are IF statements, so the 16th IF is record 17."

  - test_id: G-IF-010
    category: IF_THEN_ELSE
    description: "Boundary: exactly 15 nested IF constructs are accepted."
    rule_ids: [JCL-IF-001]
    source_reference:
      - {rule_id: "JCL-IF-001", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Purpose; Syntax; THEN and ELSE clauses", pages: "367, 373 (PDF 413, 419)"}
    input_file: inputs/if/if010.jcl
    input_kind: job
    case_type: boundary
    validation_stage: syntactic
    expected_structure: {view: none, reason: "Boundary case: only the absence of diagnostics is asserted. Nesting structure is covered by G-IF-006."}
    expected_diagnostics: {mode: exact, items: []}
    oracle_method: *m_ibm
    oracle_author: *author
    review_status: draft
    notes: ""

  - test_id: G-IF-011
    category: IF_THEN_ELSE
    description: "Relational-expression keyword not supported by IBM (CC)."
    rule_ids: [JCL-IF-003]
    source_reference:
      - {rule_id: "JCL-IF-003", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Relational-expression keywords", pages: "370 (PDF 416)"}
    input_file: inputs/if/if011.jcl
    input_kind: job
    case_type: invalid
    validation_stage: syntactic
    expected_structure: {view: none, reason: "Only the diagnostic is asserted."}
    expected_diagnostics:
      mode: exact
      items: [{code: PAR-W001, severity: WARNING, line: 3}]
    oracle_method: *m_ibm
    oracle_author: *author
    review_status: draft
    notes: "IBM: other keywords 'even if accepted by the system, are not intended or supported' (p.370), hence WARNING rather than ERROR."

  - test_id: G-IF-101
    category: IF_THEN_ELSE
    description: 'Lexical: an IF relational expression with blanks, continued where a blank is valid; the parameter field ends at THEN; comment after THEN.'
    rule_ids: [JCL-IF-004, JCL-IF-002, JCL-FMT-007]
    source_reference:
      - {rule_id: "JCL-IF-004", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Continuing a relational expression", pages: "368 (PDF 414)"}
      - {rule_id: "JCL-IF-002", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "18. IF/THEN/ELSE/ENDIF statement construct > Priorities of operators (Figure 1); Comparison/Logical operators", pages: "368-369 (PDF 414-415)"}
      - {rule_id: "JCL-FMT-007", url: "https://www.ibm.com/docs/en/SSLTBW_3.2.0/pdf/ieab600_v3r2.pdf", edition: "z/OS 3.2, SA23-1385-70", section: "3. Format of statements > Comments field", pages: "13 (PDF 59)"}
    input_file: inputs/if/if005.jcl
    input_kind: job
    case_type: valid
    validation_stage: lexical
    expected_structure:
      view: lexical
      records:
      - line: 1
        kind: STATEMENT_START
      - line: 2
        kind: STATEMENT_START
      - line: 3
        kind: STATEMENT_START
        continues: PARAMETER
      - line: 4
        kind: CONTINUATION
      - line: 5
        kind: STATEMENT_START
      - line: 6
        kind: STATEMENT_START
      lexical_statements:
      - span:
        - 1
        - 1
      - span:
        - 2
        - 2
      - span:
        - 3
        - 4
        name:
          text: TESTCON
          line: 3
          column: 3
        operation:
          text: IF
          line: 3
          column: 12
        parameter_text: (RC = 8 | RC = 10 | RC = 12 | RC = 14)  THEN
        comments:
        - line: 4
          column: 38
          text: COMMENTS OK HERE
        end: COMPLETE
        tokens:
        - - LPAREN
          - (
        - - WORD
          - RC
        - - OPERATOR
          - '='
        - - WORD
          - '8'
        - - OPERATOR
          - '|'
        - - WORD
          - RC
        - - OPERATOR
          - '='
        - - WORD
          - '10'
        - - OPERATOR
          - '|'
        - - WORD
          - RC
        - - OPERATOR
          - '='
        - - WORD
          - '12'
        - - OPERATOR
          - '|'
        - - WORD
          - RC
        - - OPERATOR
          - '='
        - - WORD
          - '14'
        - - RPAREN
          - )
        - - WORD
          - THEN
      - span:
        - 5
        - 5
      - span:
        - 6
        - 6
        operation:
          text: ENDIF
          line: 6
          column: 12
        parameter_text: ''
    expected_diagnostics:
      mode: exact
      items: []
    oracle_method: Hand-derived from the cited IBM SA23-1385-70 record and continuation rules, independently of the Lexer implementation. Record kinds, continuation types, field boundaries and tokens were decided by reading the rules; columns were measured from the designed input text by plain string indexing (no lexer code).
    oracle_author: Claude (AI assistant, claude-opus-5-5); draft awaiting human review
    review_status: draft
    notes: parameter_text joins IF records with one blank (blanks are significant in relational expressions); within a record, blanks are kept as coded. The OPERATOR token type is lexical only.
